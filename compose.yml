services:
  ip_updater:
    image: cristiancapsuna/ip_updater:latest
    deploy:
      restart_policy:
        condition: none
    secrets:
      - ip_updater_key
    configs:
      - ip_updater_record
      - ip_updater_zone
    environment:
      - KEY_PATH="/run/secrets/ip_updater_key"
      - ZONE_PATH="/ip_updater_zone"
      - RECORD_PATH="/ip_updater_record"

secrets:
  ip_updater_key:
    external: true

configs:
  ip_updater_record:
    external: true
  ip_updater_zone:
    external: true
